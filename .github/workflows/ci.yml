name: ControlForge CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: controlforge_ci
          POSTGRES_USER: controlforge
          POSTGRES_PASSWORD: controlforge_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controlforge -d controlforge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://controlforge:controlforge_ci_password@127.0.0.1:5432/controlforge_ci
      AGENTGUARD_ADMIN_KEY: ci-admin-key-not-for-production
      SYSTEM_TEST_BASE_URL: http://127.0.0.1:8000
      ENVIRONMENT: test
      DEBUG: "false"
      AGENTGUARD_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest
          pip install -e sdk/python

      - name: Compile Python
        run: |
          python -m compileall apps/api/app sdk/python/controlforge

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run Python tests
        run: pytest tests -q

      - name: Start API for dashboard build
        run: |
          uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/controlforge-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/controlforge-api.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Typecheck dashboard
        working-directory: apps/dashboard
        run: npm run typecheck

      - name: Lint dashboard
        working-directory: apps/dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
